<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Borders  Using Classes</title>
    <style>
        .p1{
            border: 1px solid rgb(51, 21, 246);            
            padding: 20px;
        }
        .p2{
            border-right: 2px solid orange;
            border-bottom: 2px solid orange;
            padding: 20px;
        }

        .p3{
            border-left: 6px solid rgb(51, 21, 246);            
            background-color: rgb(215, 213, 213);
            padding: 20px;
            font-style: italic;
        }
        .p4{
            border: 2px solid rgb(51, 21, 246); 
            border-radius: 8px;           
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>CSS Borders  Using Classes</h1>
    <p class="p1">I have borders on all sides.</p>
    <p class="p2">I have borders on all sides.</p>
    <p class="p3">I have borders on all sides.</p>
    <p class="p4">I have borders on all sides.</p>
    <p class="p5">I have borders on all sides.</p>
</body>
</html>
