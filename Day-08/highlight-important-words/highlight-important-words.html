<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight Text</title>

    <style>

        body{

            font-family: Arial, Helvetica, sans-serif;

            padding: 50px;

            background-color: #f8e9e9;
        }

        p{

            font-size: 24px;

            line-height: 1.8;
        }

        .highlight{

            background-color: yellow;

            padding: 5px 10px;

            border-radius: 5px;

            font-weight: bold;
        }

        .blue-highlight{

            background-color: cyan;

            padding: 5px 10px;

            border-radius: 5px;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <p>
        HTML creates the structure of a website while
        <span class="highlight">CSS adds beauty and styling</span>.

        Modern websites also use
        <span class="blue-highlight">animations and interactions</span>
        to improve user experience.
    </p>

</body>
</html>
