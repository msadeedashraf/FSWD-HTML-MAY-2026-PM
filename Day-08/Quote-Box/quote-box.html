<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Box</title>

    <style>

        body{
            background-color: #f8f8f8;

            font-family: Georgia, serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .quote-box{

            width: 500px;

            background-color: #fff3e0;

            padding: 30px;

            border-left: 10px solid orange;

            border-radius: 10px;

            box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
        }

        .quote-box p{

            font-size: 28px;

            font-style: italic;

            color: #444;

            line-height: 1.6;
        }

    </style>

</head>

<body>

    <div class="quote-box">

        <p>
            "Success is built one small consistent step at a time."
        </p>

    </div>

</body>
</html>
