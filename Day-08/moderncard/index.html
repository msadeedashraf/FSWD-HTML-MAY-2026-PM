<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Card</title>
      <style>

        body{
            background-color: #f4f4f4;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .card{
            width: 400px;

            background-color: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);

            transition: 0.4s;
        }

        .card:hover{
            transform: translateY(-10px);
        }

        .card h1{
            color: #333;
        }

        .card p{
            color: #666;

            line-height: 1.7;

            font-size: 18px;
        }

    </style>

</head>
<body>
     <div class="card">

        <h1>Learning HTML & CSS</h1>

        <p>
            HTML builds the structure of a website while CSS adds colors,
            layouts, animations, and modern styling.
        </p>

    </div>
</body>
</html>
